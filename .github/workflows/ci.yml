# CI keeps source hygiene, runtime safety, coverage, retrieval economics and
# the pivot-readiness oracle reproducible from one clean checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  NEUROFS_EMBEDDING_PROVIDER: mock
  TZ: UTC

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Formatting
        run: make fmt-check
      - name: Module consistency
        run: make mod-check
      - name: Static analysis
        run: make lint
      - name: Vet
        run: make vet
      - name: Race detector
        run: make race
      - name: Coverage
        run: make coverage COVERAGE_MIN=60.0
      - name: Reachable vulnerability scan
        run: make vuln
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  retrieval-gates:
    name: retrieval and economy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Retrieval and iso-recall economy gates
        run: make check-retrieval check-economy
      - name: Pivot-readiness oracle
        # The report must be written OUTSIDE the repository. G3 and G5 refuse
        # to measure against an index that does not match the working tree, and
        # `| tee gate-report.json` created an unindexed .json in the repo root
        # before the gate ran — so capturing the report was itself what made
        # the gate fail. Reproduced exactly: same tree, `gate` passes and
        # `gate --json | tee gate-report.json` fails with "target index is
        # stale". release.yml goes through `make check-gate`, captures nothing,
        # and was never affected.
        #
        # scan-self stays because G3 needs a fresh index too, and this step
        # calls the binary directly rather than via `make check-gate`.
        run: |
          set -o pipefail
          make scan-self
          ./bin/neurofs gate --json > "$RUNNER_TEMP/gate-report.json"
          cat "$RUNNER_TEMP/gate-report.json"
      - name: Upload pivot-readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pivot-readiness
          path: ${{ runner.temp }}/gate-report.json
          if-no-files-found: warn
          retention-days: 30
