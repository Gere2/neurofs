# CI keeps source hygiene, runtime safety, coverage, retrieval economics and
# the pivot-readiness oracle reproducible from one clean checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  NEUROFS_EMBEDDING_PROVIDER: mock
  TZ: UTC

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Formatting
        run: make fmt-check
      - name: Module consistency
        run: make mod-check
      - name: Static analysis
        run: make lint
      - name: Vet
        run: make vet
      - name: Race detector
        run: make race
      - name: Coverage
        run: make coverage COVERAGE_MIN=60.0
      - name: Reachable vulnerability scan
        run: make vuln
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  retrieval-gates:
    name: retrieval and economy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Retrieval and iso-recall economy gates
        run: make check-retrieval check-economy
      - name: Pivot-readiness oracle
        # Re-scan immediately before the gate, exactly as `make check-gate`
        # does. G5 hashes the current Go source tree and refuses to verify
        # against a stale index, so the gate cannot rely on the scan that
        # check-retrieval/check-economy did earlier in the job. release.yml
        # goes through `make check-gate` and is unaffected; this step called
        # the binary directly and so had drifted from that contract.
        run: |
          set -o pipefail
          make scan-self
          # TEMPORARY diagnostic: G5/G3 report a stale index here even though
          # the scan above just ran, and the same sequence passes in a clean
          # local clone. Print what the runner has that a local checkout does
          # not, so the next run answers this with evidence instead of
          # inference. Remove once the cause is identified.
          echo "--- tracked-but-modified / untracked / ignored ---"
          git status --porcelain=v1 --untracked-files=all --ignored=matching | head -60
          echo "--- audit/ contents ---"
          find audit -type f | sort | head -60
          ./bin/neurofs gate --json | tee gate-report.json
      - name: Upload pivot-readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pivot-readiness
          path: gate-report.json
          if-no-files-found: warn
          retention-days: 30
